[tool.poetry]
name = "ionpinn"
version = "0.1.0"
description = "IonPINN: Foundation Battery Model"
authors = ["Matthew Teichman <matthew.teichman@icloud.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
torch = {version = "^2.0.0", source = "pytorch"}
deepxde = "^1.11.0"
pandas = "^2.0.0"
scikit-learn = "^1.3.0"
onnx = "^1.15.0"
onnxruntime = "^1.16.0"
rich = "^13.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"
